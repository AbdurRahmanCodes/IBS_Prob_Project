services:
  postgres:
    image: postgres:16
    container_name: taskboard-postgres
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: taskboard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
