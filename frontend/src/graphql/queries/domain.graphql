query DomainData {
  users {
    id
    name
    createdAt
  }
  projects {
    id
    name
    description
    owner {
      id
      name
    }
  }
  tasks(page: 1, pageSize: 100) {
    items {
      id
      title
      status
      priority
      project {
        id
        name
      }
      assignee {
        id
        name
      }
    }
    totalCount
  }
}
