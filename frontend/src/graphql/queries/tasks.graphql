query GetTasks($page: Int, $pageSize: Int) {
  tasks(page: $page, pageSize: $pageSize) {
    items {
      id
      title
      description
      status
      priority
      createdAt
    }
    totalCount
    page
    pageSize
    totalPages
  }
}

query GetProjects {
  projects {
    id
    name
  }
}
