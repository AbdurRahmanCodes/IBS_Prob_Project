query GetTasks($page: Int, $pageSize: Int, $status: TaskStatus, $projectId: ID) {
  tasks(page: $page, pageSize: $pageSize, status: $status, projectId: $projectId) {
    items {
      id
      title
      description
      status
      priority
      dueDate
      createdAt
      project {
        id
        owner {
          id
        }
      }
    }
    totalCount
    page
    pageSize
    totalPages
  }
}

query GetProjects {
  projects {
    id
    name
  }
}
